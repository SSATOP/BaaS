spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DATABASE_URL}
    password: ${DATABASE_PASSWORD}
    username: ${DATABASE_USERNAME}



  # 메일 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  ## 레디스 설정
  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      uri: ${MONGODB_URI}


mybatis:
  type-aliases-package: com.baas.securities.repository.entity
  configuration:
    map-underscore-to-camel-case: true
    # SQL 로그에 ? 대신 실제 파라미터 값을 보이게 함
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  mapper-locations: classpath:mapper/*.xml

logging:
  level:
    # MyBatis SQL 로그를 출력
    org.mybatis: DEBUG
    # (선택) SQL 실행 파라미터 로그를 보고 싶다면 아래도 추가
    jdbc.sqlonly: DEBUG
    jdbc.sqltiming: DEBUG
    jdbc.resultset: TRACE
    jdbc.audit: DEBUG
