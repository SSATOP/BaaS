<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f2f2f2; }
        .container { max-width: 500px; margin: 50px auto; padding: 20px; background: #fff; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; }
        label { display: block; margin-top: 10px; }
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-top: 20px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
<div class="container">
    <h2>회원가입</h2>
    <form id="signupForm">
        <label for="login_id">아이디 *</label>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="login_id" name="loginId" required style="flex: 1; min-width: 200px;">
            <button type="button" id="checkIdBtn" style="padding: 6px 10px; background-color: #2196F3; color: white; border: none; border-radius: 3px; cursor: pointer; white-space: nowrap; font-size: 12px; flex-shrink: 0;">중복체크</button>
        </div>
        <div id="idCheckResult" style="margin-top: 5px; font-size: 12px;"></div>

        <label for="login_password">비밀번호 *</label>
        <input type="password" id="login_password" name="loginPassword" required>

        <label for="name">이름 *</label>
        <input type="text" id="name" name="name" required>

        <label for="birth_date">생년월일 *</label>
        <input type="date" id="birth_date" name="birthDate" required>

        <label for="phone">전화번호 *</label>
        <input type="tel" id="phone" name="phone" required>

              <label for="email">이메일 *</label>
              <div style="display: flex; gap: 10px;">
                  <input type="email" id="email" name="email" required style="flex: 1; min-width: 200px;">
                  <button type="button" id="checkEmailBtn" style="padding: 6px 10px; background-color: #2196F3; color: white; border: none; border-radius: 3px; cursor: pointer; white-space: nowrap; font-size: 12px; flex-shrink: 0;">중복체크</button>
              </div>
              <div id="emailCheckResult" style="margin-top: 5px; font-size: 12px;"></div>

        <button type="submit">회원가입</button>
    </form>

          <script>
              let isIdChecked = false; // 아이디 중복체크 여부
              let isEmailChecked = false; // 이메일 중복체크 여부

              // 아이디 중복체크 버튼 이벤트
              document.getElementById('checkIdBtn').addEventListener('click', function() {
                  const loginId = document.getElementById('login_id').value.trim();
                  const resultDiv = document.getElementById('idCheckResult');

                  if (!loginId) {
                      resultDiv.innerHTML = '<span style="color: red;">아이디를 입력해주세요.</span>';
                      isIdChecked = false;
                      return;
                  }

                  fetch(`/users/check-id?loginId=${encodeURIComponent(loginId)}`)
                      .then(response => response.text())
                      .then(message => {
                          if (message === "사용 가능한 아이디입니다.") {
                              resultDiv.innerHTML = '<span style="color: green;">✓ ' + message + '</span>';
                              isIdChecked = true;
                          } else {
                              resultDiv.innerHTML = '<span style="color: red;">✗ ' + message + '</span>';
                              isIdChecked = false;
                          }
                      })
                      .catch(error => {
                          console.error('Error:', error);
                          resultDiv.innerHTML = '<span style="color: red;">중복체크 중 오류가 발생했습니다.</span>';
                          isIdChecked = false;
                      });
              });

              // 아이디 입력 시 중복체크 상태 초기화
              document.getElementById('login_id').addEventListener('input', function() {
                  isIdChecked = false;
                  document.getElementById('idCheckResult').innerHTML = '';
              });

              // 이메일 중복체크 버튼 이벤트
              document.getElementById('checkEmailBtn').addEventListener('click', function() {
                  const email = document.getElementById('email').value.trim();
                  const resultDiv = document.getElementById('emailCheckResult');

                  if (!email) {
                      resultDiv.innerHTML = '<span style="color: red;">이메일을 입력해주세요.</span>';
                      isEmailChecked = false;
                      return;
                  }

                  fetch(`/users/check-email?email=${encodeURIComponent(email)}`)
                      .then(response => response.text())
                      .then(message => {
                          if (message === "사용 가능한 이메일입니다.") {
                              resultDiv.innerHTML = '<span style="color: green;">✓ ' + message + '</span>';
                              isEmailChecked = true;
                          } else {
                              resultDiv.innerHTML = '<span style="color: red;">✗ ' + message + '</span>';
                              isEmailChecked = false;
                          }
                      })
                      .catch(error => {
                          console.error('Error:', error);
                          resultDiv.innerHTML = '<span style="color: red;">중복체크 중 오류가 발생했습니다.</span>';
                          isEmailChecked = false;
                      });
              });

              // 이메일 입력 시 중복체크 상태 초기화
              document.getElementById('email').addEventListener('input', function() {
                  isEmailChecked = false;
                  document.getElementById('emailCheckResult').innerHTML = '';
              });
        
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 아이디 중복체크 여부 확인
            if (!isIdChecked) {
                alert('아이디 중복체크를 해주세요.');
                return;
            }
            
            // 이메일 중복체크 여부 확인
            if (!isEmailChecked) {
                alert('이메일 중복체크를 해주세요.');
                return;
            }
            
            const formData = {
                loginId: document.getElementById('login_id').value,
                loginPassword: document.getElementById('login_password').value,
                name: document.getElementById('name').value,
                birthDate: document.getElementById('birth_date').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value
            };

            fetch('/users/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => {
                if (response.ok) {
                    alert('회원가입이 완료되었습니다!');
                    window.location.href = '/users/login';
                } else {
                    return response.text().then(message => {
                        if (response.status === 409) {
                            alert('회원가입에 실패했습니다: ' + message);
                        } else if (response.status === 400) {
                            alert('비밀번호 규칙을 확인해주세요: ' + message);
                        } else {
                            alert('회원가입에 실패했습니다: ' + message);
                        }
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('회원가입 중 오류가 발생했습니다.');
            });
        });
    </script>
</div>
</body>
</html>
