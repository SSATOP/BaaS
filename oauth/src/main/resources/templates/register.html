<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
</head>
<body>

<form action="/register" method="post">
    <input name="clientName" placeholder="clientName" value="baas" readonly><br>
    <input name="clientSecret" placeholder="clientSecret" value="secret" readonly><br>
    <input name="redirectUris" placeholder="redirectUris" value="http://localhost:8080/login/oauth2/code/baas" readonly><br>
    <input name="postLogoutRedirectUris" placeholder="postLogoutRedirectUris" value="http://localhost:8080/" readonly><br>
    <input name="scopes" placeholder="scopes" value="openid,profile,email,phone" readonly><br>

    <input type="submit" value="Register"/>
</form>

</body>
</html>
